<html lang="en">
<head>
<meta charset="utf-8">

<title>Viṣṇu · The All-Pervading One</title>
<meta name="description" content="A scroll-driven journey through the names, forms and avatāras of Lord Viṣṇu, threaded by the Viṣṇu Sahasranāma. Stories of the ten avatāras for children and adults.">
<meta name="theme-color" content="#03050f">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" as="image" href="vishnu.webp" fetchpriority="high">

<meta property="og:title" content="Viṣṇu · The All-Pervading One">
<meta property="og:description" content="Scroll through the many dimensions of Viṣṇu: His names, forms and avatāras.">
<meta property="og:image" content="og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#03050f; --night:#0a1433; --nila:#2a4a9c; --indigo:#2b2566;
  --gold:#e3c47f; --gold-deep:#a8793a; --ivory:#f3ecdc; --lotus:#e2a9b3;
  --ink-soft:rgba(243,236,220,.66); --ink-faint:rgba(243,236,220,.54);
  --serif:"Cormorant Garamond","EB Garamond",Georgia,"Times New Roman",serif;
  --deva:"Tiro Devanagari Sanskrit","Noto Serif Devanagari","Kohinoor Devanagari",Mangal,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --mx:0; --my:0;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --abyss:#03050f; --ivory:#f3ecdc; } }
:root[data-theme="dark"]{ --abyss:#03050f; --ivory:#f3ecdc; }
html{background:var(--abyss);scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--abyss);color:var(--ivory);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--gold);outline-offset:6px}
#cosmos{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;pointer-events:none}
#root{position:relative;z-index:1}

/* ---------- scroll machinery ---------- */
.scene{position:relative;height:calc(var(--h,200) * 1vh)}
.stage{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;display:grid;place-items:center;isolation:isolate}
.rv,.kk,.hl{
  --k:clamp(0, calc((var(--p,0) - var(--a,0)) / var(--d,.12)), 1);
  --q:clamp(0, calc((var(--p,0) - var(--z,2)) / var(--dz,.08)), 1);
}
.rv{opacity:calc(var(--k) * (1 - var(--q)));
  transform:translate3d(0, calc((1 - var(--k)) * var(--ty,22px) - var(--q) * var(--ty,22px)), 0) scale(calc(1 + (1 - var(--k)) * var(--sc,0)));
  will-change:opacity,transform}
.layer{position:absolute;inset:0;pointer-events:none}
.par{transform:translate3d(calc(var(--mx) * -14px), calc(var(--my) * -10px), 0);transition:transform .9s cubic-bezier(.2,.7,.2,1);will-change:transform}
.par-2{transform:translate3d(calc(var(--mx) * 8px), calc(var(--my) * 6px), 0);transition:transform 1.1s cubic-bezier(.2,.7,.2,1);will-change:transform}

/* ---------- navigation ---------- */
.nav{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(18px,3vw,40px);pointer-events:none;transition:opacity 1.2s ease}
.nav > *{pointer-events:auto}
body.immersed .nav{opacity:.16}
body.immersed .nav:hover,body.immersed .nav:focus-within{opacity:1}
.nav-mark{font-family:var(--deva);font-size:26px;color:var(--gold);text-decoration:none;line-height:1;opacity:.9}
.nav-list{display:flex;gap:clamp(14px,2vw,30px);list-style:none;margin:0;padding:0}
.nav-list a{font-size:14px;letter-spacing:.06em;color:var(--ink-soft);text-decoration:none;padding:6px 0;position:relative;transition:color .5s}
.nav-list a::after{content:"";position:absolute;left:50%;bottom:0;width:3px;height:3px;border-radius:50%;background:var(--gold);transform:translateX(-50%) scale(0);transition:transform .5s}
.nav-list a:hover,.nav-list a[aria-current="true"]{color:var(--ivory)}
.nav-list a[aria-current="true"]::after{transform:translateX(-50%) scale(1)}
.nav-toggle{display:none;background:none;border:1px solid rgba(227,196,127,.35);border-radius:999px;padding:8px 16px;font-size:12px;letter-spacing:.06em;color:var(--ivory);cursor:pointer}
.progress{position:fixed;z-index:30;left:0;top:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);will-change:transform;background:linear-gradient(90deg,transparent,rgba(227,196,127,.7));pointer-events:none}

/* ---------- type ---------- */
.h-title{font-family:var(--serif);font-weight:300;font-size:clamp(44px,8.6vw,138px);letter-spacing:.14em;line-height:.95;margin:0;padding-left:.14em;color:var(--ivory)}
.h-sub{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(19px,2vw,28px);color:var(--ink-soft);margin:16px 0 0;letter-spacing:.01em}
.heading{text-align:center}
.h-stack{display:grid;place-items:center}
.h-stack > *{grid-area:1/1}
.small-note{font-family:var(--sans);font-size:clamp(13px,1.05vw,15px);line-height:1.65;color:var(--ink-faint);max-width:52ch;margin:0 auto;text-align:center}

/* ---------- aspect composition ---------- */
.aspect{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,4.6vh,54px);padding:0 6vw;text-align:center;width:100%}
.dim{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse 70% 60% at 50% 55%,rgba(3,5,15,.62),rgba(3,5,15,.18) 75%);opacity:calc(var(--k) * (1 - var(--q)));pointer-events:none}
.v-ghost{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.2em;font-family:var(--serif);font-weight:300;font-size:clamp(46px,8.4vw,132px);line-height:1;white-space:nowrap;color:var(--ivory);pointer-events:none;
  opacity:calc((.045 + var(--k) * .05) * (1 - var(--q)));will-change:transform,opacity;
  transform:translateX(calc((var(--p,0) - .5) * -14vw))}
.v-ghost div:nth-child(2){transform:translateX(calc((var(--p,0) - .5) * 20vw))}

.verse{position:relative;max-width:min(1120px,92vw)}
.verse-btn{all:unset;display:block;cursor:pointer;padding:10px 12px;border-radius:2px}
.verse-btn:focus-visible{outline:1px solid var(--gold);outline-offset:10px}
.v-line{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.5vw,68px);line-height:1.1;color:rgba(243,236,220,.86);letter-spacing:.005em}
.v-line + .v-line{margin-top:.1em}
.hl{position:relative;display:inline-block;white-space:nowrap}
.kfade{opacity:calc(var(--k) * (1 - var(--q)))}
.hl .g{position:absolute;left:0;top:0;white-space:nowrap;color:var(--gold);opacity:calc(var(--k) * (1 - var(--q)));text-shadow:0 0 22px rgba(227,196,127,.55),0 0 70px rgba(227,196,127,.3)}
.hl .b{transition:none}
.v-deva{display:block;font-family:var(--deva);font-size:clamp(17px,1.7vw,24px);color:var(--ink-faint);margin-top:18px;line-height:1.6}
.v-mean{margin-top:clamp(18px,3.4vh,34px);font-family:var(--serif);font-style:italic;font-size:clamp(19px,1.9vw,27px);line-height:1.45;color:var(--ink-soft)}
.v-mean .m{display:block}
.v-open{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;margin-top:clamp(16px,3vh,28px);font-family:var(--sans);font-size:14px;min-height:40px;letter-spacing:.06em;color:rgba(227,196,127,.85);padding:8px 2px;border-bottom:1px solid rgba(227,196,127,.25);transition:color .4s,border-color .4s}
.v-open:hover{color:var(--gold);border-color:var(--gold)}
.v-open:focus-visible{outline:1px solid var(--gold);outline-offset:6px}
.v-open .dot{width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.extra{font-family:var(--serif);font-size:clamp(17px,1.6vw,22px);font-style:italic;color:var(--ink-faint);max-width:44ch;margin:0 auto;line-height:1.5}

/* ---------- hero ---------- */
.hero .hero-photo{position:absolute;inset:0;z-index:1;overflow:hidden;opacity:calc(1 - var(--q));
  transform:scale(calc(1 + var(--p,0) * .12));transform-origin:50% 42%;will-change:transform,opacity;
  -webkit-mask-image:linear-gradient(180deg,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,#000 80%,transparent 100%)}
.hp-zoom{position:absolute;inset:0;animation:photoIn 3s cubic-bezier(.2,.7,.2,1) both, breathe 24s ease-in-out 3s infinite alternate;will-change:transform}
.hp-zoom img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
.hp-streaks{position:absolute;inset:0;pointer-events:none;opacity:.75;mix-blend-mode:overlay;
  background:repeating-linear-gradient(90deg,rgba(170,195,255,.07) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,8,.22) 0 1px,transparent 1px 5px,rgba(0,0,8,.12) 5px 6px,transparent 6px 11px)}
.hp-light{position:absolute;left:25%;top:10%;width:50%;height:70%;pointer-events:none;mix-blend-mode:screen;border-radius:50%;
  background:radial-gradient(circle,rgba(150,185,255,.2),transparent 62%);
  transform:translate3d(calc(var(--mx) * 22vw),calc(var(--my) * 14vh),0);transition:transform 1.2s cubic-bezier(.2,.7,.2,1);will-change:transform}
.hp-shade{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(180deg,rgba(3,6,20,.6) 0%,transparent 16%,transparent 58%,rgba(3,6,20,.72) 80%,rgba(3,6,20,.9) 100%),
  radial-gradient(ellipse 80% 75% at 50% 42%,transparent 55%,rgba(2,4,14,.65) 100%)}
@keyframes photoIn{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:scale(1)}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.045)}}
.hero .hero-text{position:absolute;z-index:3;left:0;right:0;bottom:calc(8svh + 10px);text-align:center}
.hero .hero-text::before{content:"";position:absolute;z-index:-1;left:50%;top:-8svh;bottom:-7svh;width:min(900px,130vw);transform:translateX(-50%);background:radial-gradient(ellipse 50% 55% at 50% 55%,rgba(3,6,20,.85),rgba(3,6,20,.45) 55%,transparent 76%);pointer-events:none}
.hero h1{margin:0 0 4px;font-family:var(--serif);font-weight:300;font-size:clamp(54px,8.5vw,124px);letter-spacing:.2em;padding-left:.2em;line-height:1;
  background:linear-gradient(180deg,#fdf8ea 0%,#f1d897 58%,#c4954a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleIn 2.4s cubic-bezier(.2,.7,.2,1) .7s both}
.hero-sub{font-family:var(--serif);font-style:italic;font-size:clamp(21px,2.2vw,30px);margin:0;color:var(--ivory);animation:rise 2.2s cubic-bezier(.2,.7,.2,1) 1.4s both}
.hero-deva{font-family:var(--deva);font-size:clamp(21px,2vw,28px);color:var(--gold);margin:12px 0 2px;animation:rise 2.2s cubic-bezier(.2,.7,.2,1) 1.7s both}
.hero-iast{font-size:14px;letter-spacing:.12em;color:var(--ink-soft);margin:0;animation:rise 2.2s cubic-bezier(.2,.7,.2,1) 1.9s both}
.scroll-cue-wrap{position:absolute;z-index:3;left:0;right:0;bottom:3.2svh;display:flex;justify-content:center}
.scroll-cue{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;letter-spacing:.08em;color:var(--ink-faint);animation:rise 2s ease 2.8s both}
.scroll-cue i{display:block;width:1px;height:38px;background:linear-gradient(var(--gold),transparent);transform-origin:top;animation:cue 2.8s ease-in-out infinite}
@keyframes titleIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes figIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cue{0%{transform:scaleY(0);opacity:0}40%{opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
@keyframes turnY{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.72)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
@keyframes flow{to{stroke-dashoffset:-400}}
.fig-chakra{}

/* ---------- visuals ---------- */
.vis{position:absolute;inset:0;z-index:0;display:grid;place-items:center;pointer-events:none}
.vis svg{width:100%;height:100%;display:block}
.orbits{opacity:calc(.2 + var(--k) * .8);transform:rotate(calc(var(--p,0) * 16deg)) scale(calc(.9 + var(--p,0) * .25))}
.self-point{position:absolute;left:50%;top:50%;width:62vmin;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(calc(.02 + var(--k) * .98));will-change:transform;
  background:radial-gradient(circle,rgba(255,250,235,.95) 0,rgba(255,244,214,.35) 3%,rgba(200,190,255,.08) 30%,transparent 68%);opacity:calc(.5 + var(--k) * .5)}
.nara-burst{transform:scale(calc(.7 + var(--k) * .5));opacity:calc(var(--k) * (1 - var(--q)))}
.rays{}
.sun{transform:translateY(calc((1 - var(--k)) * 70px))}
.river path{stroke-dasharray:4 14}
.shesha-anno{opacity:calc(var(--k) * (1 - var(--q)));transition:none}
.anno-t{font-family:var(--sans);font-size:13px;letter-spacing:.06em;fill:rgba(243,236,220,.72)}
.anno-l{stroke:rgba(227,196,127,.45);stroke-width:1}
.float{animation:float 9s ease-in-out infinite;will-change:transform}

/* ---------- attributes ---------- */
.attrs{position:absolute;inset:0;z-index:2}
.attr{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:5vw;padding:0 9vw;pointer-events:none}
.attr.on{pointer-events:auto}
.attr-obj{justify-self:center;width:min(52vh,480px);aspect-ratio:1;display:grid;place-items:center;position:relative}
.attr-obj > div{width:100%;height:100%}
.attr-obj svg{width:100%;height:100%;display:block}
.m-spin{animation:spin 60s linear infinite;will-change:transform}
.m-sway{animation:sway 14s ease-in-out infinite;will-change:transform}
.m-turn{animation:turnY 16s ease-in-out infinite;will-change:transform}
.attr-text{text-align:left}
.attr-name{font-family:var(--serif);font-weight:300;font-size:clamp(42px,6.2vw,104px);letter-spacing:.1em;margin:0;line-height:1}
.attr-sub{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2vw,28px);color:var(--ink-soft);margin:12px 0 26px}
.attr-line{font-family:var(--serif);font-size:clamp(22px,2.3vw,32px);line-height:1.35;margin:0;color:var(--ivory);max-width:22ch}
.attr-vs{margin-top:32px;padding-top:18px;border-top:1px solid rgba(227,196,127,.22);max-width:30ch;font-size:13.5px;line-height:1.6;color:var(--ink-faint)}
.attr-vs b{display:block;font-family:var(--serif);font-weight:400;font-style:italic;font-size:22px;color:var(--gold);margin-bottom:2px}
.attr-steps{position:absolute;z-index:3;left:50%;bottom:6svh;transform:translateX(-50%);display:flex;gap:12px}
.attr-steps span{width:22px;height:1px;background:rgba(243,236,220,.2);position:relative;overflow:hidden}
.attr-steps span::after{content:"";position:absolute;inset:0;background:var(--gold);transform-origin:0 50%;transform:scaleX(var(--k))}
.attr-note{position:absolute;z-index:3;left:0;right:0;bottom:calc(6svh + 26px)}
.lotus .pt{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(calc(var(--ang) * (.22 + .78 * var(--open,1)) * 1deg))}

/* ---------- forms ---------- */
.ring{position:absolute;z-index:4;left:50%;top:50%;width:min(86vmin,760px);aspect-ratio:1;transform:translate(-50%,-50%) rotate(calc(var(--p,0) * -36deg));opacity:calc(.35 + var(--k) * .65);will-change:transform}
.ring-i{position:absolute;width:11%;transform:translate(-50%,-50%) rotate(calc(var(--p,0) * 36deg));background:none;border:0;padding:0;cursor:pointer;color:var(--av-c,var(--gold));display:flex;flex-direction:column;align-items:center;gap:6px}
.ring-ic{display:block;width:100%;aspect-ratio:1;opacity:.78;transition:opacity .35s,transform .35s}
.ring-ic svg{width:100%;height:100%;display:block}
.ring-i:hover .ring-ic,.ring-i:focus-visible .ring-ic{opacity:1;transform:scale(1.12)}
.ring-l{font-family:var(--serif);font-size:17px;color:var(--ivory);white-space:nowrap;opacity:.85}
.forms-note{color:var(--ink-soft)}
.forms-big .h-title{font-size:clamp(46px,9vw,150px);transform:scale(calc(1.15 - var(--p,0) * .2))}

/* ---------- avatars ---------- */
.av-env{position:absolute;inset:0;z-index:0;background:var(--env);opacity:calc(var(--k) * (1 - var(--q)))}
.av-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:6vw;padding:0 9vw;width:100%}
.av.even .av-grid{direction:rtl}
.av.even .av-grid > *{direction:ltr}
.av-emblem{justify-self:center;width:min(46vh,430px);aspect-ratio:1;color:var(--av-c,var(--gold));border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--av-c,var(--gold)) 20%,transparent) 0%,transparent 66%)}
.av-emb-btn{all:unset;display:block;width:100%;height:100%;cursor:pointer;border-radius:50%}
.av-emb-btn:focus-visible{outline:1px solid var(--gold);outline-offset:8px}
.av-emb-btn > div{width:100%;height:100%}
.av-emb-btn:hover .float{animation-duration:4s}
.av-emblem svg{width:100%;height:100%;display:block}
.av-num{font-family:var(--deva);font-size:clamp(46px,6vw,96px);line-height:1;color:rgba(227,196,127,.22);margin-bottom:8px}
.av-name{font-family:var(--serif);font-weight:300;font-size:clamp(50px,7.6vw,124px);letter-spacing:.04em;line-height:1;margin:0}
.av-ep{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2vw,28px);color:var(--ink-soft);margin:12px 0 22px}
.av-line{font-family:var(--serif);font-size:clamp(19px,1.75vw,24px);line-height:1.5;color:rgba(243,236,220,.8);max-width:34ch;margin:0}
.av-alt{margin-top:14px;font-size:13px;color:var(--ink-faint);letter-spacing:.02em}
.av-name-vs{margin-top:22px;font-size:13px;color:var(--ink-faint)}
.av-name-vs em{font-family:var(--serif);font-size:19px;color:var(--gold);font-style:italic;margin-right:6px}
.note-block{position:relative;min-height:70vh;display:grid;place-items:center;padding:12vh 8vw}
.note-block .small-note{font-size:clamp(14px,1.15vw,16px)}
.note-block h3{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(24px,2.4vw,34px);color:var(--ivory);margin:0 0 18px;text-align:center}

/* ---------- krishna names ---------- */
.names-list{display:flex;flex-direction:column;gap:clamp(12px,2.4vh,22px)}
.names-list .nl-n{font-family:var(--serif);font-size:clamp(34px,4.4vw,64px);font-weight:400;color:var(--ivory);line-height:1}
.names-list .nl-g{display:block;font-size:13.5px;color:var(--ink-faint);margin-top:6px;letter-spacing:.02em}

/* ---------- purushottama ---------- */
.puru .h-title{font-size:clamp(40px,10vw,176px);letter-spacing:.14em;transform:scale(calc(1.25 - var(--p,0) * .45));will-change:transform}

/* ---------- vaikuntha ---------- */
.vk-bloom{position:absolute;inset:-10%;z-index:0;background:radial-gradient(ellipse 60% 55% at 50% 52%,rgba(255,250,236,.96),rgba(247,232,196,.72) 30%,rgba(214,186,130,.24) 62%,transparent 80%);opacity:calc(var(--k) * (1 - var(--q)))}
.vk .aspect{color:#1c1a3e}
.vk .h-title{color:#1c1a3e}
.vk .h-sub,.vk .v-mean{color:rgba(28,26,62,.74)}
.vk .v-line{color:rgba(28,26,62,.9)}
.vk .v-deva{color:rgba(28,26,62,.55)}
.vk .hl .g{color:#8a5a14;text-shadow:0 0 18px rgba(255,236,190,.9)}

const polar = (r,deg,cx=0,cy=0) => { const t=deg*Math.PI/180; return [f1(cx+r*Math.cos(t)), f1(cy+r*Math.sin(t))]; };

function chakraSVG(id, opts={}){
  const {teethR=[80,95], rings=true} = opts;
  let teeth=[]; const N=48;
  for(let i=0;i<N*2;i++){ const [x,y]=polar(i%2?teethR[0]:teethR[1], i*180/N - 90); teeth.push(x+','+y); }
  let spokes='';
  for(let i=0;i<12;i++){ const a=i*30; const [x0,y0]=polar(20,a), [x1,y1]=polar(62,a), [c1x,c1y]=polar(41,a+6), [c2x,c2y]=polar(41,a-6);
    spokes+=`<path d="M${x0} ${y0} Q${c1x} ${c1y} ${x1} ${y1} Q${c2x} ${c2y} ${x0} ${y0} Z"/>`; }
  let dots=''; for(let i=0;i<24;i++){ const [x,y]=polar(70,i*15+7.5); dots+=`<circle cx="${x}" cy="${y}" r="2.1"/>`; }
  return `<svg viewBox="-100 -100 200 200" aria-hidden="true"><defs>
  <radialGradient id="${id}a"><stop offset="0" stop-color="#fff7de"/><stop offset=".5" stop-color="#ecc97f"/><stop offset="1" stop-color="#a87a35"/></radialGradient>
  <radialGradient id="${id}h"><stop offset=".55" stop-color="#e3c47f" stop-opacity=".22"/><stop offset="1" stop-color="#e3c47f" stop-opacity="0"/></radialGradient></defs>
  <circle r="100" fill="url(#${id}h)"/>
  <polygon points="${teeth.join(' ')}" fill="url(#${id}a)" opacity=".92"/>
  <circle r="78" fill="#0b1333"/><circle r="76" fill="none" stroke="#f1d48e" stroke-width="1.4"/>
  ${rings?`<circle r="64" fill="none" stroke="#f1d48e" stroke-width=".9" opacity=".7"/>`:''}
  <g fill="#f1d48e" opacity=".9">${dots}</g>
  <g fill="url(#${id}a)" stroke="#fff3cf" stroke-width=".5">${spokes}</g>
  <circle r="19" fill="url(#${id}a)"/><circle r="10" fill="#0b1333"/><circle r="5" fill="#fff4d6"/></svg>`;
}

let COSMOS = null;
function Cosmos(canvas){
  const ctx = canvas.getContext('2d', {alpha:false});
  let Wd=0, Ht=0;
  const clone = o => JSON.parse(JSON.stringify(o));
  const cur = clone(WORLDS.hero); let tgt = WORLDS.hero;
  const api = { gz:0, gzCur:0, pulse:0, pulseT:0, mx:0, my:0 };
  const rnd = Math.random;
  const stars = [...Array(MOBILE?170:380)].map(()=>{ const z=rnd()**2; return {x:rnd(),y:rnd(),z,r:.7+z*1.6,tw:rnd()*6.28,sp:.4+rnd()}; });
  const embers = [...Array(MOBILE?30:60)].map(()=>({x:rnd(),y:rnd(),v:.0006+rnd()*.0014,s:1+rnd()*1.8,ph:rnd()*6.28}));
  const dust = [...Array(MOBILE?26:54)].map(()=>({x:rnd(),y:rnd(),v:.00012+rnd()*.0003,s:1+rnd()*1.6,ph:rnd()*6.28}));
  const gpts = [...Array(MOBILE?600:1200)].map((_,i)=>{ const t=rnd()**.8; const arm=i%3; const g=(rnd()+rnd()+rnd()-1.5)*.5;
    return {r:t, a:arm*2.094+t*4.4+g*(1-t*.4), s:rnd()*1.4+.6, w:t<.18?1:rnd()<.3?.6:0}; });
  const far = [...Array(14)].map(()=>({x:rnd(),y:rnd(),rx:8+rnd()*26,rot:rnd()*3.14,al:.3+rnd()*.5}));
  /* the sky is soft and slow, so it is drawn at CSS-pixel resolution (never 2–3× on retina phones) */
  function resize(){ Wd=window.innerWidth; Ht=window.innerHeight; canvas.width=Wd; canvas.height=Ht; }
  resize(); window.addEventListener('resize', resize);
  const lerp=(a,b,t)=>a+(b-a)*t;
  const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
  function fillRadial(x,y,r,stops){ const g=ctx.createRadialGradient(x,y,0,x,y,r); stops.forEach(([o,c])=>g.addColorStop(o,c)); ctx.fillStyle=g; ctx.fillRect(Math.max(0,x-r),Math.max(0,y-r),Math.min(Wd,2*r),Math.min(Ht,2*r)); }
  function step(t){
    const k = RM ? .12 : .045;
    for(const key of ['top','bot','glow']) for(let i=0;i<3;i++) cur[key][i]=lerp(cur[key][i],tgt[key][i],k);
    for(const key of ['glowAmt','stars','nebula','ocean','embers','galaxy','dust','light']) cur[key]=lerp(cur[key],tgt[key],k);
    api.pulse = lerp(api.pulse, api.pulseT, .05); api.gzCur = lerp(api.gzCur, api.gz, .08);
    const T = RM ? 0 : t;
    const g = ctx.createLinearGradient(0,0,0,Ht); g.addColorStop(0,rgba(cur.top,1)); g.addColorStop(1,rgba(cur.bot,1));
    ctx.fillStyle=g; ctx.fillRect(0,0,Wd,Ht);
    const M=Math.max(Wd,Ht);
    if(cur.nebula>.02){
      fillRadial(Wd*(.28+Math.sin(T*.00005)*.05), Ht*(.32+Math.cos(T*.00004)*.04), M*.7, [[0,rgba(cur.glow,.13*cur.nebula)],[1,rgba(cur.glow,0)]]);
      fillRadial(Wd*(.78+Math.cos(T*.00003)*.05), Ht*.7, M*.6, [[0,`rgba(70,50,150,${.14*cur.nebula})`],[1,'rgba(70,50,150,0)']]);
    }
    if(api.pulse>.02) fillRadial(Wd/2,Ht*.52,M*.55,[[0,rgba(cur.glow,.16*api.pulse)],[1,rgba(cur.glow,0)]]);
    if(cur.light>.02) fillRadial(Wd/2,Ht*.5,M*.75,[[0,`rgba(255,248,230,${.9*cur.light})`],[.45,`rgba(240,220,170,${.35*cur.light})`],[1,'rgba(240,220,170,0)']]);
    if(cur.stars>.02){ const sy=window.scrollY;
      for(const s of stars){ let y=(s.y*Ht - sy*.018*(.2+s.z)) % Ht; if(y<0) y+=Ht; const x=s.x*Wd + api.mx*s.z*14;
        const tw = RM ? 1 : .65+.35*Math.sin(T*.0012*s.sp+s.tw);
        ctx.fillStyle=`rgba(255,248,232,${cur.stars*(.25+.7*s.z)*tw})`; ctx.fillRect(x,y+api.my*s.z*8,s.r,s.r); } }
    if(cur.galaxy>.02){ const cx=Wd/2+api.mx*10, cy=Ht*.5; const sc=lerp(3.4,.46,api.gzCur)*Math.min(Wd,Ht)*.5; const rot=T*.000018;
      fillRadial(cx,cy,sc*.35,[[0,`rgba(255,238,200,${.55*cur.galaxy})`],[1,'rgba(255,238,200,0)']]);
      for(const p of gpts){ const a=p.a+rot*(1.4-p.r); const x=cx+Math.cos(a)*p.r*sc, y=cy+Math.sin(a)*p.r*sc*.42; if(x<-5||x>Wd+5||y<-5||y>Ht+5) continue;
        const al=cur.galaxy*(.25+.6*(1-p.r))*(p.w?1:.7); ctx.fillStyle = p.w ? `rgba(255,236,200,${al})` : `rgba(170,180,255,${al})`; ctx.fillRect(x,y,p.s,p.s); }
      const fa=cur.galaxy*Math.max(0,api.gzCur-.35)/.65;
      if(fa>.02) for(const f of far){ ctx.fillStyle=`rgba(230,225,255,${.35*fa*f.al})`; ctx.beginPath(); ctx.ellipse(f.x*Wd,f.y*Ht,f.rx,f.rx*.38,f.rot,0,6.283); ctx.fill(); }
    }
    if(cur.ocean>.02){ const hz=Ht*.68; const og=ctx.createLinearGradient(0,hz,0,Ht); og.addColorStop(0,'rgba(4,10,30,0)'); og.addColorStop(.25,`rgba(3,8,26,${.55*cur.ocean})`); og.addColorStop(1,`rgba(2,5,18,${.85*cur.ocean})`); ctx.fillStyle=og; ctx.fillRect(0,hz,Wd,Ht-hz);
      ctx.lineWidth=1; const L=MOBILE?8:12;
      for(let i=0;i<L;i++){ const y=hz+Math.pow(i,1.55)*4.6+4; const amp=1.5+i*.9; const ph=T*.00035*(1+i*.08)+i;
        ctx.strokeStyle=rgba(cur.glow,cur.ocean*(.05+.1*(1-i/L))); ctx.beginPath();
        for(let x=0;x<=Wd;x+=24){ const yy=y+Math.sin(x*.006+ph)*amp+Math.sin(x*.017-ph*1.3)*amp*.4; x?ctx.lineTo(x,yy):ctx.moveTo(x,yy); } ctx.stroke(); }
      fillRadial(Wd/2,hz+20,Wd*.3,[[0,rgba(cur.glow,.12*cur.ocean)],[1,rgba(cur.glow,0)]]);
    }
    if(cur.embers>.02){ for(const e of embers){ if(!RM){ e.y-=e.v; if(e.y<-.02){e.y=1.02;e.x=rnd();} }
      const a=cur.embers*(.3+.5*Math.sin(T*.003+e.ph)**2)*(1-Math.abs(e.y-.5));
      ctx.fillStyle=`rgba(255,${170+(e.s*20|0)},90,${a})`; ctx.fillRect(e.x*Wd+Math.sin(T*.001+e.ph)*14, e.y*Ht, e.s, e.s); } }
    if(cur.dust>.02){ const dc = cur.light>.5?[190,150,80]:cur.glow; for(const d of dust){ if(!RM){ d.y-=d.v; if(d.y<-.02){d.y=1.02;d.x=rnd();} }
      ctx.fillStyle=rgba(dc,cur.dust*(.25+.35*Math.sin(T*.001+d.ph)**2)); ctx.fillRect(d.x*Wd+Math.sin(T*.0004+d.ph)*20+api.mx*6, d.y*Ht, d.s, d.s); } }
  }
  /* full frame rate only while the reader is scrolling; ~30fps when idle; stopped under dialogs */
  let last=0, lastScroll=0, paused=false;
  window.addEventListener('scroll',()=>{ lastScroll=performance.now(); },{passive:true});
  function loop(t){ requestAnimationFrame(loop); if(paused || document.hidden) return; if(t-lastScroll>500 && t-last<33) return; last=t; step(t); }
  requestAnimationFrame(loop);
  api.setWorld = name => { if(WORLDS[name]) tgt=WORLDS[name]; };
  api.pause = v => { paused=v; };
  return api;
}

/* ===================================================================== COMPONENTS */
const Raw = ({svg, className, style}) => html`<div className=${className} style=${style} aria-hidden="true" dangerouslySetInnerHTML=${{__html:svg}}></div>`;

function Rv({a=0, d=.12, z, dz, ty, sc, as='div', className='', style, children, ...rest}){
  const s = {'--a':a,'--d':d, ...(z!=null?{'--z':z}:{}), ...(dz!=null?{'--dz':dz}:{}), ...(ty!=null?{'--ty':ty}:{}), ...(sc!=null?{'--sc':sc}:{}), ...style};
  return html`<${as} className=${('rv '+className).trim()} style=${s} ...${rest}>${children}<//>`;
}

function Heading({title, sub, a=0, z, d=.12, className=''}){
  return html`<${Rv} a=${a} z=${z} d=${d} className=${'heading '+className}><h2 className="h-title">${title}</h2>${sub && html`<p className="h-sub">${sub}</p>`}<//>`;
}

function VerseGhost({vkey, a=.04, z}){
  const v=VERSES[vkey];
  return html`<div className="v-ghost kk" style=${{'--a':a,'--d':.3,'--z':z??.94,'--dz':.06}} aria-hidden="true">${v.iast.map((l,i)=>html`<div key=${i}>${l}</div>`)}</div>`;
}
function Dim({a=.05, z}){ return html`<div className="dim kk" style=${{'--a':a,'--d':.15,'--z':z??.94,'--dz':.06}}></div>`; }

function Verse({vkey, focus, meaning=[], a=.12, z, onOpen, showDeva=true}){
  const v=VERSES[vkey];
  return html`<${Rv} a=${a} d=${.16} z=${z} className="verse">
    <button className="verse-btn" onClick=${()=>onOpen(vkey)} aria-label=${'Open the full śloka: '+v.ref}>
      ${focus.map((line,li)=>html`<span className="v-line" key=${li}>${line.map((tok,ti)=>html`<${React.Fragment} key=${ti}>${ti?' ':''}${tok.a!=null
        ? html`<span className="hl" style=${{'--a':tok.a,'--d':.1,'--z':z??2}}><span className="b">${tok.t}</span><span className="g" aria-hidden="true">${tok.t}</span></span>`
        : tok.t}<//>`)}</span>`)}
      ${showDeva && html`<span className="v-deva" lang="sa">${v.focusDeva}</span>`}
    </button>
    ${meaning.length>0 && html`<div className="v-mean">${meaning.map((m,i)=>html`<${Rv} key=${i} as="span" a=${m.a} d=${.1} ty="10px" className="m">${m.t}<//>`)}</div>`}
    <button className="v-open" onClick=${()=>onOpen(vkey)}><span className="dot"></span>Open the full śloka</button>
  <//>`;
}

/* generic scroll scene wrapper */
function Scene({id, world, nav, h, hm, pulse, className='', children}){
  const st={'--h':h}; if(hm) st['--hm']=hm;
  return html`<section id=${id} className=${'scene '+className} data-track="" data-world=${world} data-nav=${nav} data-pulse=${pulse?'1':undefined} style=${st}>
    <div className="stage">${children}</div></section>`;
}

/* ---------- AVATAR STORY ---------- */
function StoryModal({index, onClose, onNav}){
  const av = AVATARS[index], st = STORIES[av.id];
  const closeRef = useRef(null), bodyRef = useRef(null), touch = useRef(null);
  const canSpeak = typeof window !== 'undefined' && 'speechSynthesis' in window;
  const [speaking, setSpeaking] = useState(false);
  const stop = () => { if(canSpeak) window.speechSynthesis.cancel(); setSpeaking(false); };
  useEffect(()=>{ const prev=document.activeElement; closeRef.current && closeRef.current.focus({preventScroll:true}); document.body.style.overflow='hidden';
    return ()=>{ document.body.style.overflow=''; if(canSpeak) window.speechSynthesis.cancel(); prev && prev.focus && prev.focus({preventScroll:true}); }; },[]);
  useEffect(()=>{ const k=e=>{ if(e.key==='Escape') onClose(); else if(e.key==='ArrowRight') onNav(1); else if(e.key==='ArrowLeft') onNav(-1); };
    window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k); },[onClose,onNav]);
  useEffect(()=>{ stop(); if(bodyRef.current) bodyRef.current.scrollTop=0; },[index]);
  const speak = () => {
    if(speaking){ stop(); return; }
    const synth=window.speechSynthesis; synth.cancel();
    const u=new SpeechSynthesisUtterance([av.n+'. '+av.e+'.', ...st.story, 'What the story teaches. '+st.lesson].join(' '));
    const voices=synth.getVoices(); const v=voices.find(v=>/en[-_]IN/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang)); if(v) u.voice=v;
    u.rate=.92; u.onend=()=>setSpeaking(false); u.onerror=()=>setSpeaking(false);
    synth.speak(u); setSpeaking(true);
  };
  const prev = AVATARS[(index+AVATARS.length-1)%AVATARS.length], next = AVATARS[(index+1)%AVATARS.length];
  return html`<div className="story-modal" role="dialog" aria-modal="true" aria-labelledby="story-title" onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }}>
    <article className="story-card" style=${{'--env':av.env,'--av-c':av.c}}
      onTouchStart=${e=>{ touch.current=[e.touches[0].clientX,e.touches[0].clientY]; }}
      onTouchEnd=${e=>{ if(!touch.current) return; const dx=e.changedTouches[0].clientX-touch.current[0], dy=e.changedTouches[0].clientY-touch.current[1]; if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6) onNav(dx<0?1:-1); touch.current=null; }}>
      <button ref=${closeRef} className="story-x" onClick=${onClose} aria-label="Close the story">×</button>
      <header className="story-hero">
        <div className="story-emb" aria-hidden="true" dangerouslySetInnerHTML=${{__html:EMBLEMS[av.id]}}></div>
        <div>
          <p className="story-count">Avatāra ${index+1} of ${AVATARS.length}</p>
          <h2 id="story-title">${av.n}</h2>
          <p className="story-deva" lang="sa">${st.deva}</p>
          <p className="story-ep">${av.e}</p>
        </div>
      </header>
      <div className="story-body" ref=${bodyRef}>
        ${canSpeak && html`<button className="listen" aria-pressed=${speaking} onClick=${speak}><span className="sb-ic" dangerouslySetInnerHTML=${{__html:SPEAK_ICON}}></span>${speaking?'Stop reading':'Read it to me'}</button>`}
        ${st.story.map((para,i)=>html`<p key=${i}>${para}</p>`)}
        <aside className="lesson"><b>What the story teaches</b><p>${st.lesson}</p></aside>
        <p className="story-src">${st.source}</p>
      </div>
      <nav className="story-nav" aria-label="More stories">
        <button onClick=${()=>onNav(-1)} aria-label=${'Previous story: '+prev.n}>‹ ${prev.n}</button>
        <span>${index+1} / ${AVATARS.length}</span>
        <button onClick=${()=>onNav(1)} aria-label=${'Next story: '+next.n}>${next.n} ›</button>
      </nav>
    </article>
  </div>`;
}

    extra:[{t:"In the Bhagavad Gītā (15.18), Kṛṣṇa names Himself Puruṣottama: beyond the perishable, and higher even than the imperishable.",a:.76}]},
  {type:'aspect', id:'narayana', world:'narayana', nav:'Nārāyaṇa', h:200, hm:180, visual:'narayana', exit:.94,
    headings:[{title:"NĀRĀYAṆA", sub:"The Refuge of All Beings", a:.03, z:.44}],
    mantra:{deva:"ॐ नमो नारायणाय", iast:"Om Namo Narayanaya", a:.48},
    extra:[{t:"An old etymology: the waters are called nārā, and He who first rested upon them is Nārāyaṇa, the refuge of all beings.",a:.66}]},
  {type:'shesha'},
  {type:'aspect', id:'vaikuntha', world:'vaikuntha', nav:'Vaikuṇṭha', h:240, hm:200, visual:'vaikuntha', exit:.94, className:'vk',
    headings:[{title:"VAIKUṆṬHA", sub:"The Eternal Abode", a:.1, z:.5}],
    verse:{key:'vaikuntha', a:.5, focus:F("Vaikuṇṭhaḥ@.58 Puruṣaḥ Prāṇaḥ / Prāṇadaḥ Praṇavaḥ@.7 Pṛthuḥ"),
      meaning:[{t:"Vaikuṇṭha. The Person. The breath of life.",a:.6},{t:"Its giver. Oṁ. The Vast.",a:.72}]}},
  {type:'sahasranama'},
  {type:'final'}
];

/* ===================================================================== APP + ENGINE */
function App(){
  const [verse,setVerse] = useState(null);
  const [story,setStory] = useState(null);
  const open = useCallback(k=>setVerse(k),[]);
  const openStory = useCallback(i=>setStory(i),[]);
  const closeStory = useCallback(()=>setStory(null),[]);
  const navStory = useCallback(d=>setStory(i=>(i+d+AVATARS.length)%AVATARS.length),[]);
  useEffect(()=>{ if(COSMOS) COSMOS.pause(verse!==null || story!==null); },[verse,story]);
  useEffect(()=>{
    const cosmos = COSMOS = Cosmos(document.getElementById('cosmos'));
    const tracks = [...document.querySelectorAll('[data-track]')];
    const worlds = [...document.querySelectorAll('[data-world]')];
    const links = [...document.querySelectorAll('[data-navlink]')];
    const bar = document.querySelector('.progress');
    /* geometry is measured once (and on resize), so scrolling never forces layout reads */
    let tg=[], wg=[], vh=window.innerHeight, docH=1, lastY=-1, lastNav='', lastWorld='', lastMove=0, raf, mx=0, my=0, mDirty=false, actEl=null;
    const measure = () => { const y=window.scrollY; vh=window.innerHeight;
      tg = tracks.map(el=>{ const r=el.getBoundingClientRect(); return {el, top:r.top+y, h:r.height, p:-1}; });
      wg = worlds.map(el=>{ const r=el.getBoundingClientRect(); return {el, top:r.top+y, bot:r.bottom+y}; });
      docH = Math.max(1, document.documentElement.scrollHeight - vh); lastY=-1; };
    measure();
    const ro = new ResizeObserver(measure); ro.observe(document.body);
    window.addEventListener('resize', measure);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    const onMove = e => { if(e.pointerType && e.pointerType!=='mouse') return; if(e.clientY<110) lastMove=performance.now();
      if(RM) return; mx=(e.clientX/window.innerWidth-.5)*2; my=(e.clientY/window.innerHeight-.5)*2; mDirty=true; };
    window.addEventListener('pointermove', onMove, {passive:true});
    function tick(now){
      raf = requestAnimationFrame(tick);
      const y = window.scrollY;
      if(y!==lastY){
        lastY = y;
        for(const t of tg){ if(t.top+t.h < y-vh*.5 || t.top > y+vh*1.5) continue;
          const p = Math.round(Math.min(1,Math.max(0,(y-t.top)/Math.max(1,t.h-vh)))*1000)/1000;
          if(p!==t.p){ t.p=p; t.el._p=p; t.el.style.setProperty('--p', p); } }
        const mid = y+vh*.5; let act=null; for(const w of wg){ if(w.top<=mid && w.bot>mid) act=w.el; }
        if(act){
          actEl = act; mDirty = true;
          let w = act.dataset.world; const p = act._p||0;
          if(w==='purushottama') cosmos.gz=p;
          if(w==='final' && p>.84) w='end';
          if(w!==lastWorld){ cosmos.setWorld(w); lastWorld=w; }
          cosmos.pulseT = act.dataset.pulse ? Math.max(0,Math.min(1,(p-.45)/.2))*Math.max(0,Math.min(1,(.95-p)/.1)) : 0;
          const nv = act.dataset.nav||''; if(nv!==lastNav){ lastNav=nv; links.forEach(l=>l.setAttribute('aria-current', l.dataset.navlink===nv?'true':'false')); }
        }
        bar.style.transform = 'scaleX('+(y/docH).toFixed(4)+')';
      }
      if(mDirty && actEl){ mDirty=false; actEl.style.setProperty('--mx', mx.toFixed(3)); actEl.style.setProperty('--my', my.toFixed(3)); cosmos.mx=mx; cosmos.my=my; }
      const immersed = y>vh*.7 && now-lastMove>2200;
      if(document.body.classList.contains('immersed')!==immersed) document.body.classList.toggle('immersed', immersed);
    }
    raf = requestAnimationFrame(tick);
    return ()=>{ cancelAnimationFrame(raf); ro.disconnect(); window.removeEventListener('pointermove',onMove); window.removeEventListener('resize',measure); };
  },[]);
  return html`<${React.Fragment}>
    <div className="progress" aria-hidden="true"></div>
    <${Nav} />
    <main>
      ${SECTIONS.map((s,i)=>{
        switch(s.type){
          case 'hero': return html`<${HeroSection} key=${i} />`;
          case 'aspect': return html`<${AspectSection} key=${s.id} s=${s} onOpen=${open} />`;
          case 'attributes': return html`<${AttributeSection} key=${i} onOpen=${open} />`;
          case 'forms': return html`<${FormsIntro} key=${i} onStory=${openStory} />`;
          case 'avatars': return html`<${AvatarsGroup} key=${i} onStory=${openStory} />`;
          case 'shesha': return html`<${CosmicOceanSection} key=${i} onOpen=${open} />`;
          case 'sahasranama': return html`<${SahasranamaField} key=${i} onOpen=${open} />`;
          case 'final': return html`<${FinalPrayerSection} key=${i} />`;
          default: return null;
        }})}
      <footer className="colophon" data-world="end">
        <h3>About the texts</h3>
        <p>The Sanskrit and transliteration follow the standard recited text of the Viṣṇu Sahasranāma from the Anuśāsana Parva of the Mahābhārata. Śloka numbers follow the common recitation; other editions number differently, and a few names have variant readings, such as virajaḥ and virataḥ in śloka 43.</p>
        <p>The English lines are brief interpretive renderings, not definitive translations. The classical commentaries of Ādi Śaṅkara and Parāśara Bhaṭṭa often read the same name in different ways, and the ordering of the four attributes and of the ten avatāras differs across traditions. The avatāra stories are short retellings of the Purāṇic and epic accounts, which themselves vary from text to text.</p>
        <span className="om" lang="sa">ॐ</span>
      </footer>
    </main>
    ${verse && html`<${VerseModal} vkey=${verse} onClose=${()=>setVerse(null)} />`}
    ${story!==null && html`<${StoryModal} index=${story} onClose=${closeStory} onNav=${navStory} />`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
